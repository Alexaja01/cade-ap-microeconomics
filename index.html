3px;display:block}.lesson{border-left:4px solid #4575d8;background:#f0f4fc;padding:13px 16px;border-radius:7px;margin:16px 0}.question{font-size:18px;font-weight:650;margin:15px 0}.option{display:block;border:1px solid var(--line);border-radius:9px;padding:11px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#eff4ff}.option input{margin-right:9px}.feedback{padding:14px;border-radius:10px;background:#edf5ff;margin:14px 0;border-left:4px solid #4575d8}.feedback.correct{background:#e9f7ef;border-left-color:var(--green)}.feedback.wrong{background:#fff2ed;border-left-color:var(--red)}.progress{height:9px;background:#e4e9f2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.listrow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.hint{font-size:13px;color:var(--muted)}.formula{font-weight:700;color:#243c70}.graph{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}.graph svg{display:block;width:100%;height:auto}.graphcontrols{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}.graphcontrols label{display:flex;align-items:center;gap:8px}footer{padding:25px;color:var(--muted);text-align:center;font-size:12px}input[type=number]{width:130px;border:1px solid var(--line);border-radius:8px;padding:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);text-align:right;padding:8px}th:first-child,td:first-child{text-align:left}.notice{font-size:13px;background:#fff8e8;border:1px solid #ead9a3;padding:10px;border-radius:9px;margin-top:15px}@media(max-width:760px){main{display:block;margin:10px auto}aside{position:static;margin-bottom:12px;padding:8px;display:flex;overflow-x:auto}aside h3{display:none}.nav{white-space:nowrap;width:auto;font-size:13px}header{padding:13px 16px}.grid{grid-template-columns:1fr 1fr}h1{font-size:24px}.panel{padding:15px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.buttonrow button{flex:1}}
 .teachblock{background:#f0f5ff;border:1px solid #d5e2ff;padding:19px;border-radius:13px;margin:15px 0}.teachblock h3{font-size:19px}.steps{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.stepchip{border-radius:100px;background:#e5ebf7;padding:5px 12px;font-size:13px}.stepchip.on{background:#244fba;color:white}.mini{background:#fff;border:1px solid #dce2ed;border-radius:11px;padding:14px;margin:12px 0}.workrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.teachgraph{width:100%;display:block;max-height:280px}.workrow input{max-width:145px}.smalltable td,.smalltable th{text-align:center;padding:7px}.smalltable{font-size:13px}.feedback{line-height:1.6}@media(max-width:670px){.twocol{grid-template-columns:1fr}} </style></head><body><header><div><b>CADE / AP MICRO</b><br><small>Cambridge HS · Unit 3 · Interactive study center</small></div><span class="pill" id="saveStatus">Saved on this device</span></header><main><aside id="sidebar"></aside><section id="content" aria-live="polite"></section></main><footer>Teaching edition v2 · Based on Fulk Unit 3 decks and provided FRQ practice · Local device storage only</footer><script>
'use strict';
const LESSONS=[
{id:'production',title:'3-1 Production & marginal returns',source:'3-1 Law of Diminishing Marginal Returns, pizza table',description:'Total product, marginal product, average product, and stages of diminishing returns.',teach:'Total product (TP) is all units produced. Marginal product (MP) is the CHANGE in total product from one more worker. Average product (AP) is total product divided by workers. When MP falls but remains positive, TP continues to rise, just more slowly. When MP becomes negative, TP declines.',formula:'MP = ΔTP / Δworkers; AP = TP / workers',questions:[
{concept:'marginal_product',kind:'choice',q:'Two workers produce 25 pizzas, and three workers produce 45. What is the third worker’s marginal product?',options:['15 pizzas','20 pizzas','45 pizzas','70 pizzas'],answer:1,why:'The marginal product is the addition to total output: 45 − 25 = 20 pizzas.',wrong:'Do not confuse the new total of 45 with the additional output of 20.'},
{concept:'diminishing_returns',kind:'choice',q:'Marginal product moves from 20 pizzas for worker 3 to 15 for worker 4. What has begun?',options:['Negative total product','Diminishing marginal returns','Economies of scale','A rise in fixed costs'],answer:1,why:'Marginal product begins to fall when the fourth worker is added. Total product still increases.',wrong:'Diminishing marginal returns means MP is falling; it does not require MP to be negative.'},
{concept:'average_product',kind:'number',q:'Six workers produce 75 pizzas. What is average product per worker?',answer:12.5,tol:.01,why:'AP = 75 / 6 = 12.5 pizzas per worker.',wrong:'Average product divides the entire total by the number of workers.'},
{concept:'negative_returns',kind:'choice',q:'Output drops from 75 pizzas with seven workers to 70 with eight. What is the eighth worker’s marginal product?',options:['0','5','−5','70'],answer:2,why:'MP = 70 − 75 = −5 pizzas. This is negative marginal returns.',wrong:'When adding a worker reduces total production, marginal product is negative.'}]},
{id:'costs',title:'3-1 Short-run costs',source:'3-1 slide cost table; study guide orange boxes',description:'Fixed/variable costs and average/marginal cost calculations.',teach:'In the short run at least one input is fixed. Total cost (TC) = fixed cost (FC) + variable cost (VC). Average costs divide by quantity; marginal cost is the extra cost of the NEXT unit.',formula:'TC = FC + VC; ATC = TC/Q; AVC = VC/Q; AFC = FC/Q; MC = ΔTC/ΔQ',questions:[
{concept:'total_cost',kind:'number',q:'At output 3, fixed cost is $100 and variable cost is $21. Calculate total cost.',answer:121,tol:.01,why:'TC = FC + VC = 100 + 21 = $121.',wrong:'Total cost includes BOTH fixed and variable cost.'},
{concept:'marginal_cost',kind:'number',q:'Total cost rises from $116 at output 2 to $121 at output 3. What is marginal cost of the third unit?',answer:5,tol:.01,why:'MC = 121 − 116 = $5 for one additional unit.',wrong:'Marginal cost is the difference in total cost, not average total cost.'},
{concept:'average_total_cost',kind:'number',q:'At Q = 4, total cost is $126. What is average total cost? Enter a decimal.',answer:31.5,tol:.01,why:'ATC = TC/Q = 126/4 = $31.50.',wrong:'Divide total cost by output, not by the number of workers.'},
{concept:'fixed_cost_shift',kind:'choice',q:'Rent (a fixed cost) rises, with no other changes. Which per-unit cost curves shift up?',options:['MC and AVC','AFC and ATC','Only MC','All cost curves'],answer:1,why:'A higher fixed cost increases AFC and therefore ATC. It does not change MC or AVC.',wrong:'Rent is fixed: the cost of one additional unit and variable cost per unit do not change.'}]},
{id:'longcost',title:'3-2 Long-run production costs',source:'3-2 Long-run Production Costs',description:'Long-run average cost, scale, plant capacity.',teach:'In the long run all inputs can vary, so firms can change plant size. Economies of scale mean lower long-run average total cost at greater output. Diseconomies mean higher long-run average total cost. Constant returns to scale correspond to a flat segment of the illustrative LRATC curve.',formula:'LRATC = lowest feasible average total cost at each output level',questions:[
{concept:'economies_scale',kind:'choice',q:'As a manufacturer expands its plant, average cost per car falls. What is this?',options:['Diseconomies of scale','Economies of scale','Diminishing marginal returns','Shutdown'],answer:1,why:'Economies of scale arise when increasing scale reduces long-run average total cost.',wrong:'Do not confuse falling LRATC (scale) with diminishing marginal returns (short run).'},
{concept:'short_long_run',kind:'choice',q:'Which statement distinguishes the long run from the short run?',options:['Long run always means more than one year','In the long run, all inputs are variable','In the long run, firms cannot change capacity','In the short run, all inputs are variable'],answer:1,why:'Economic short and long runs refer to whether inputs can be changed, not a specific calendar duration.',wrong:'The short run has at least one fixed input; the long run allows all inputs to vary.'},
{concept:'diseconomies',kind:'choice',q:'A company becomes difficult to coordinate as it expands and its average costs increase. Which phenomenon?',options:['Economies of scale','Positive economic profit','Diseconomies of scale','Allocative efficiency'],answer:2,why:'Diseconomies of scale describe rising long-run average cost as output expands.',wrong:'Management and coordination complexity can cause diseconomies of scale.'}]},
{id:'shortcomp',title:'3-3 Perfect competition: short run',source:'3-3 Perfect Competition Short Run',description:'Price taking, marginal revenue, profit and shutdown.',teach:'A competitive firm faces a market-determined price. Thus its own demand, average revenue, and marginal revenue are the same horizontal line. For a producing firm the optimal output is where the next unit’s marginal cost reaches marginal revenue on the rising MC segment; in short-run shutdown analysis compare market price with minimum AVC.',formula:'P = D = MR = AR; profit = (P − ATC) × Q',questions:[
{concept:'price_taker',kind:'choice',q:'Why is an individual perfectly competitive firm a price taker?',options:['It has a monopoly','It sells an identical product among many sellers','It controls market supply','It pays no variable costs'],answer:1,why:'Numerous sellers of identical goods mean a single firm cannot sustainably charge more than the market price.',wrong:'Market supply and demand determine price for a small competitive firm.'},
{concept:'profit_rule',kind:'choice',q:'For a price-taking firm that remains open, what condition identifies profit-maximizing output?',options:['P = ATC at all quantities','MR = MC on the rising MC segment','MC = AFC','TR = TC at every quantity'],answer:1,why:'It expands production while marginal revenue exceeds marginal cost, and stops as MC catches MR.',wrong:'The decision compares the additional revenue and additional cost of output.'},
{concept:'profit_calc',kind:'number',q:'A firm sells 7 units at $9 each. Its total cost is $45. Calculate economic profit in dollars.',answer:18,tol:.01,why:'Total revenue = 7 × 9 = $63; profit = $63 − $45 = $18.',wrong:'Calculate total revenue first, then subtract total cost.'},
{concept:'shutdown',kind:'choice',q:'Market price falls below minimum average variable cost. What should the firm do in the short run?',options:['Operate because fixed costs are sunk','Shut down temporarily','Enter the market','Always raise the price'],answer:1,why:'When price does not cover avoidable variable costs, producing increases loss relative to shutting down.',wrong:'Fixed costs remain payable in the short run even if the firm stops producing.'}]},
{id:'longcomp',title:'3-4 Competition: long run',source:'3-4 Perfect Competition Long-Run',description:'Entry, exit, industry supply, firm output, zero economic profit.',teach:'In the standard constant-cost competitive model, positive economic profit attracts entry. Industry supply expands, market price falls, and each incumbent firm produces less. Losses lead to exit, industry supply contracts, and market price rises. Entry/exit ends at zero economic profit.',formula:'Long-run equilibrium (standard model): P = MC = minimum ATC',questions:[
{concept:'firm_entry',kind:'choice',q:'Competitive firms currently earn positive economic profit. What happens in the long run?',options:['Firms exit; market supply shrinks','Firms enter; market supply increases','Every firm increases its price','Market demand must fall'],answer:1,why:'Profit attracts new firms and shifts industry supply right.',wrong:'New competitors enter when economic profit creates an incentive.'},
{concept:'price_after_entry',kind:'choice',q:'After entry increases industry supply (demand unchanged), what happens to market price?',options:['It falls','It rises','It stays higher permanently','It becomes the same as AFC'],answer:0,why:'A rightward industry supply shift reduces market price at the new market equilibrium.',wrong:'Entry increases market supply, tending to reduce the market price.'},
{concept:'firm_exit',kind:'choice',q:'Many firms incur economic losses. In the long run, what tends to happen?',options:['Entry causes supply to rise','Exit causes supply to fall','Firms raise price individually','Marginal cost becomes zero'],answer:1,why:'Losses induce exit, shifting market supply left until remaining firms cover their economic costs.',wrong:'Losses discourage participation; firms exit rather than enter.'},
{concept:'normal_profit',kind:'choice',q:'At long-run competitive equilibrium, what is economic profit?',options:['Negative','Zero','Always more than accounting profit','Equal to total revenue'],answer:1,why:'Zero economic profit still includes normal profit: explicit and implicit costs are covered.',wrong:'Normal profit is embedded in economic costs and is compatible with zero economic profit.'}]},
{id:'efficiency',title:'3-5 Efficiency & review',source:'3-5 Perfect Competition Efficiency and Review',description:'Productive and allocative efficiency; cost changes.',teach:'Productive efficiency means producing at the minimum average total cost. Allocative efficiency means the marginal benefit to buyers (represented by price in this model) equals marginal cost. In the standard long-run competitive equilibrium, P = MC = minimum ATC.',formula:'Productive: P = minimum ATC; Allocative: P = MC',questions:[
{concept:'productive_efficiency',kind:'choice',q:'Which condition identifies productive efficiency in the standard long-run competitive equilibrium?',options:['P = minimum ATC','P < AVC','MR > MC','Economic profit is positive'],answer:0,why:'At the minimum of ATC, a firm produces its output at the lowest unit cost.',wrong:'Productive efficiency concerns minimum average total cost.'},
{concept:'allocative_efficiency',kind:'choice',q:'Which equality captures allocative efficiency?',options:['P = AFC','P = MC','ATC = AVC','Q = zero'],answer:1,why:'Price represents marginal benefit; equality with marginal cost signals efficient allocation in this model.',wrong:'Allocative efficiency compares marginal benefit with marginal cost.'},
{concept:'variable_cost_shift',kind:'choice',q:'If variable input costs increase, which cost curves change?',options:['Only AFC','MC, AVC and ATC','Only AFC and ATC','None'],answer:1,why:'Higher variable costs affect variable cost per unit and the cost of additional output, raising AVC, ATC, and typically MC.',wrong:'AFC changes with fixed costs, not variable costs.'}]}
];
const K='cade_micro_unit3_v1';const initial=()=>({events:[],mode:'home',lesson:0,stage:0,workers:3,fc:100,costQ:3,scenario:0,tryAnswer:'',tryChecked:false,retry:null,index:0,selected:null,submitted:false,attempted:[],diagnostic:false,graphShift:0});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(K)||'{}')}}catch{state=initial()}let ui={};function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch{document.querySelector('#saveStatus').textContent='Storage unavailable'}}function totals(){let a=state.events.filter(e=>e.type==='graded');return {n:a.length,correct:a.filter(x=>x.correct).length,concepts:new Set(a.map(x=>x.concept)).size}}function conceptStats(){let m={};for(let e of state.events.filter(e=>e.type==='graded')){let s=m[e.concept]||(m[e.concept]={correct:0,n:0,last:0});s.n++;if(e.correct)s.correct++;s.last=e.correct?1:0}return m}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,cl='secondary'){let id='a'+Object.keys(ui).length;ui[id]=fn;return `<button class="${cl}" data-action="${id}">${esc(label)}</button>`}function navigate(mode,lesson=state.lesson){state.mode=mode;state.lesson=lesson;state.stage=0;state.tryChecked=false;state.tryAnswer='';state.retry=null;state.index=0;state.selected=null;state.submitted=false;state.attempted=[];save();render()}function nav(){let tabs=[['home','Overview'],['diagnostic','Diagnostic'],['practice','Learn & practice'],['graphs','Graph lab'],['progress','Progress & export']];return `<h3>Study center</h3>${tabs.map(([k,v])=>`<button class="nav ${state.mode===k?'active':''}" data-nav="${k}">${v}</button>`).join('')}`}
function home(){let t=totals();return `<div class="hero"><div class="eyebrow" style="color:#bbd2ff">Course-based study system</div><h1>AP Microeconomics · Unit 3</h1><p class="muted">Costs of production and perfect competition. Immediate feedback, targeted remediation, and independent checks.</p>${btn('Start 12-question diagnostic',()=>navigate('diagnostic'), 'primary')} ${btn('Start learning',()=>navigate('practice'))}</div><div class="grid"><div class="metric"><span class="muted">Graded answers</span><b>${t.n}</b></div><div class="metric"><span class="muted">First-pass accuracy*</span><b>${t.n?Math.round(t.correct/t.n*100)+'%':'—'}</b></div><div class="metric"><span class="muted">Concepts attempted</span><b>${t.concepts}</b></div></div><div class="panel"><h2>Unit 3 lessons</h2>${LESSONS.map((l,i)=>`<div class="listrow"><div><b>${esc(l.title)}</b><div class="hint">${esc(l.description)}</div></div>${btn('Learn',()=>navigate('learn',i),'ghost')}</div>`).join('')}<p class="hint">*Accuracy combines independent first attempts; use the export for question-level details. This local prototype does not yet send reports to Make or Google Sheets.</p></div>`}
function current(){return state.diagnostic?diagnosticSet():LESSONS[state.lesson].questions}function diagnosticSet(){return LESSONS.flatMap(l=>l.questions.map(q=>({...q,lesson:l.title}))).filter((_,i)=>[0,1,2,4,5,7,9,11,12,15,17,20].includes(i))}function exercise(){let lesson=LESSONS[state.lesson];let arr=current();if(state.index>=arr.length){let mistakes=state.attempted.filter(a=>!a.correct);return `<div class="panel"><h2>${state.diagnostic?'Diagnostic':'Lesson practice'} complete</h2><p>You completed ${arr.length} questions. ${mistakes.length} first-attempt errors were identified.</p><p>${state.diagnostic?'Choose a lesson to correct weaker concepts.':'Review the missed concepts with new practice; return later for an independent check.'}</p><div class="buttonrow">${btn('View progress',()=>navigate('progress'),'primary')}${btn('Restart this set',()=>{state.index=0;state.attempted=[];state.submitted=false;state.selected=null;save();render()})}${btn('Choose lessons',()=>navigate('practice'))}</div></div>`}let q=arr[state.index];let intro=state.diagnostic?'<b>Independent diagnostic</b> · Explanations appear only after the full set.':`<div class="eyebrow">Source: ${esc(lesson.source)}</div><h2>${esc(lesson.title)}</h2><div class="lesson">${esc(lesson.teach)}<div class="formula">${esc(lesson.formula)}</div></div>`;let opts=q.kind==='choice'?q.options.map((v,i)=>`<label class="option"><input type="radio" name="ans" value="${i}" ${state.selected===String(i)?'checked':''} ${state.submitted?'disabled':''}>${esc(v)}</label>`).join(''):`<input id="numanswer" type="number" step="any" inputmode="decimal" value="${esc(state.selected??'')}" placeholder="Enter your answer" ${state.submitted?'disabled':''}>`;let feed=state.submitted&&!state.diagnostic?`<div class="feedback ${state.lastCorrect?'correct':'wrong'}"><b>${state.lastCorrect?'Correct':'Review this concept'}</b><p>${esc(state.lastCorrect?q.why:q.wrong+' '+q.why)}</p>${!state.lastCorrect?'<span class="hint">This concept is now marked for targeted review in the progress view.</span>':''}</div>`:'';return `<div class="panel">${intro}<div class="eyebrow">Question ${state.index+1} of ${arr.length}${q.lesson?' · '+esc(q.lesson):''}</div><div class="progress"><div style="width:${state.index/arr.length*100}%"></div></div><div class="question">${esc(q.q)}</div>${opts}${feed}<div class="buttonrow">${!state.submitted?btn('Submit answer',submit,'primary'):btn(state.index===arr.length-1?'Finish':'Next question',nextQuestion,'primary')}${!state.diagnostic?btn('Return to lesson',()=>navigate('learn',state.lesson),'ghost'):''}</div>${state.diagnostic?'<p class="hint">No answer explanations in diagnostic mode. This measures independent knowledge.</p>':''}</div>`}
function submit(){let arr=current(),q=arr[state.index],raw=q.kind==='choice'?document.querySelector('input[name="ans"]:checked')?.value:document.querySelector('#numanswer')?.value;if(raw===undefined||raw===null||raw==='')return alert('Choose or enter an answer first.');let correct=q.kind==='choice'?Number(raw)===q.answer:Math.abs(Number(raw)-q.answer)<=q.tol;state.selected=raw;state.submitted=true;state.lastCorrect=correct;state.attempted.push({concept:q.concept,correct});state.events.push({type:'graded',time:new Date().toISOString(),question:q.q,concept:q.concept,answer:raw,correct,expected:q.kind==='choice'?q.options[q.answer]:q.answer,mode:state.diagnostic?'diagnostic':'guided',lesson:q.lesson||LESSONS[state.lesson].title});save();render()}
function nextQuestion(){state.index++;state.selected=null;state.submitted=false;save();render()}
const TP=[0,10,25,45,60,70,75,75,70];
const VC=[0,10,16,21,26,30,36,46];
const MODULES=[
{title:'How output changes when workers are added',intro:'Imagine a pizza kitchen with fixed ovens. Add workers one at a time. Specialization initially raises marginal product; eventually the ovens become crowded and each additional worker adds less output.',key:'Total product (TP) is all pizzas made. Marginal product (MP) is the CHANGE in pizzas when another worker joins. Average product (AP) is TP divided by workers.',take:'Falling marginal product is not the same as negative marginal product.',kind:'workers',prompt:'With four workers output is 60 pizzas; with five it is 70. What is the fifth worker’s marginal product?',answer:10,detail:'70 − 60 = 10 pizzas. The extra worker still raises total output, but marginal returns are diminishing.',retry:'With five workers output is 70 pizzas and with six it is 75. What is the sixth worker’s marginal product?',retryAnswer:5,retryDetail:'75 − 70 = 5 additional pizzas.'},
{title:'Build a cost table, not just memorize formulas',intro:'A firm has fixed cost of $100 and incurs variable costs as it produces more units. Calculate costs for a chosen output. Notice how fixed cost gets spread across units.',key:'TC = FC + VC; AFC = FC/Q; AVC = VC/Q; ATC = TC/Q; MC = change in TC divided by change in Q.',take:'Increasing fixed cost raises AFC and ATC, but not AVC or MC.',kind:'cost',prompt:'At quantity 3, fixed cost is $100 and variable cost is $21. What is average total cost? Round to two decimals.',answer:40.33,detail:'TC = 100 + 21 = 121; ATC = 121 ÷ 3 = 40.33.',retry:'At quantity 4, fixed cost is $100 and variable cost is $26. What is ATC?',retryAnswer:31.5,retryDetail:'TC = 126, so ATC = 126 ÷ 4 = 31.50.'},
{title:'Why a larger factory can lower average costs',intro:'In the short run, at least one input is fixed. In the long run the firm can choose a different plant size. Expansion can lower per-unit cost, stop providing savings, or ultimately increase coordination costs.',key:'Falling long-run ATC = economies of scale. Flat long-run ATC = constant returns to scale. Rising long-run ATC = diseconomies of scale.',take:'Short-run diminishing marginal returns and long-run economies of scale describe different situations.',kind:'scale',prompt:'A firm expands its plant and long-run average cost falls from $80 to $65 per unit. Enter the dollar DECREASE in average cost.',answer:15,detail:'80 − 65 = $15 less per unit. Falling LRATC illustrates economies of scale.',retry:'A larger plant reduces average cost from $65 to $58. What is the reduction?',retryAnswer:7,retryDetail:'65 − 58 = $7 reduction in long-run average cost.'},
{title:'Find output where marginal revenue meets marginal cost',intro:'A perfectly competitive firm sells identical products at the market price. It cannot individually set a higher price. It compares the extra revenue from one unit with the extra cost of that unit.',key:'For a price-taking firm P = MR = AR = demand. To maximize profit, choose output where MR = MC on the rising MC curve, if operating is preferable to shutdown.',take:'MR = MC also identifies the loss-minimizing positive output when the firm should remain open.',kind:'price',prompt:'A firm sells each unit for $15. What is its marginal revenue from selling one additional unit?',answer:15,detail:'With perfect competition, each additional unit sells for the same market price, so MR = P = $15.',retry:'If market price changes to $18, what is marginal revenue from the next unit?',retryAnswer:18,retryDetail:'The price-taking firm receives MR = $18 per additional unit.'},
{title:'Trace entry and exit all the way to the long run',intro:'Economic profit attracts new firms, increasing industry supply. Losses induce exit, reducing industry supply. Changes in market price change the horizontal demand line facing each remaining firm.',key:'Entry: industry supply rises, price falls, and firm output generally falls along MC. Exit: supply falls, price rises, and remaining firm output generally rises.',take:'Long-run competitive equilibrium has zero ECONOMIC profit (normal profit), with P = MC = minimum ATC under the usual assumptions.',kind:'entry',prompt:'Suppose entry causes market price to drop from $15 to $10. By how many dollars does the price fall?',answer:5,detail:'$15 − $10 = $5. Entry expands market supply and puts downward pressure on price.',retry:'Suppose exit causes market price to rise from $15 to $20. By how many dollars does price rise?',retryAnswer:5,retryDetail:'$20 − $15 = $5. Exit contracts market supply.'},
{title:'Distinguish two definitions of efficiency',intro:'Productive efficiency concerns producing at the lowest average total cost. Allocative efficiency concerns producing the quantity where marginal benefit equals marginal cost.',key:'Productive efficiency: P = minimum ATC in a long-run competitive equilibrium. Allocative efficiency: P = MC.',take:'Under the standard perfectly competitive model, a long-run firm achieves both conditions at once.',kind:'efficiency',prompt:'If price is $12 and marginal cost is $9, by how many dollars does price exceed marginal cost?',answer:3,detail:'12 − 9 = $3. Where price exceeds MC, marginal benefit exceeds marginal cost, supporting additional production.',retry:'If price is $10 and marginal cost is $8, by how many dollars does P exceed MC?',retryAnswer:2,retryDetail:'10 − 8 = $2.'}
];
function sparkLine(values,color='#2563b8',maxY=85){let w=370,h=160,x=i=>34+i*(w-58)/(values.length-1),y=v=>h-22-v/maxY*(h-42);return `<svg class="teachgraph" viewBox="0 0 ${w} ${h}" role="img" aria-label="Data graph"><path d="M34 12V${h-22}H${w-12}" stroke="currentColor" opacity=".6" fill="none"/><polyline fill="none" stroke="${color}" stroke-width="3" points="${values.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===state.workers?5:3}" fill="${color}"/>`).join('')}<text x="${w-95}" y="${h-4}" font-size="11" fill="currentColor">Input / output</text></svg>`}
function interact(m){if(m.kind==='workers'){let n=state.workers,mp=n?TP[n]-TP[n-1]:null;return `<div class="mini"><h3>Explore: add or remove workers</h3><div class="workrow">${btn('− Worker',()=>{state.workers=Math.max(0,state.workers-1);save();render()},'ghost')}<b>${n} workers</b>${btn('+ Worker',()=>{state.workers=Math.min(8,state.workers+1);save();render()},'secondary')}</div><div class="twocol"><div>${sparkLine(TP)}<p class="hint">Total pizzas for 0–8 workers, from the 3-1 slides.</p></div><div><div class="metric"><span>Total product</span><b>${TP[n]} pizzas</b></div><div class="metric"><span>Marginal product</span><b>${mp===null?'—':mp+' pizzas'}</b></div><div class="metric"><span>Average product</span><b>${n?(TP[n]/n).toFixed(2):'—'}</b></div></div></div><p class="hint">At worker 4, marginal product starts falling. At worker 8, marginal product is negative.</p></div>`}
if(m.kind==='cost'){let q=state.costQ,fc=state.fc,vc=VC[q],tc=fc+vc;return `<div class="mini"><h3>Explore: production costs</h3><div class="workrow"><label>Output <select id="costq">${VC.slice(1).map((_,i)=>`<option value="${i+1}" ${q===i+1?'selected':''}>${i+1} units</option>`).join('')}</select></label><label>Fixed cost <select id="fixedc"><option value="100" ${fc===100?'selected':''}>$100</option><option value="200" ${fc===200?'selected':''}>$200</option></select></label></div><div class="twocol"><table class="smalltable"><tr><th>Measure</th><th>Value</th></tr><tr><td>FC</td><td>$${fc}</td></tr><tr><td>VC</td><td>$${vc}</td></tr><tr><td>TC</td><td>$${tc}</td></tr><tr><td>AFC</td><td>$${(fc/q).toFixed(2)}</td></tr><tr><td>AVC</td><td>$${(vc/q).toFixed(2)}</td></tr><tr><td>ATC</td><td>$${(tc/q).toFixed(2)}</td></tr><tr><td>MC</td><td>$${VC[q]-VC[q-1]}</td></tr></table><div class="teachblock"><b>Prediction:</b> Change fixed cost from $100 to $200. Which measures change?<p>AFC, ATC and total cost rise. Marginal cost and AVC remain unchanged.</p></div></div></div>`}
if(m.kind==='entry'){let arr=[{title:'Initial profit',copy:'Price above ATC attracts entrants; firm earns positive economic profit.'},{title:'Industry entry',copy:'More firms shift industry supply right. Market price falls and industry output rises.'},{title:'New long-run equilibrium',copy:'The remaining firms take the lower price; economic profit returns to zero under the standard constant-cost assumption.'}];let z=arr[state.scenario];return `<div class="mini"><h3>Explore: long-run adjustment</h3><div class="steps">${arr.map((a,i)=>btn(String(i+1)+' · '+a.title,()=>{state.scenario=i;save();render()},i===state.scenario?'primary':'ghost')).join('')}</div><div class="teachblock"><h3>${z.title}</h3><p>${z.copy}</p></div><p class="hint">This is the entry sequence in Fulk 3-4 and 3-5, summarized without copying the original animations.</p></div>`}
if(m.kind==='price')return `<div class="mini"><h3>Explore: profit or loss?</h3><p>Compare three market prices for the same firm: at P = $7 above ATC, the firm can earn economic profit; at P = $5 below ATC but above minimum AVC, it can continue at a loss in the short run; at P below minimum AVC it should shut down.</p>${btn('Open linked graph lab',()=>navigate('graphs'),'secondary')}</div>`;
if(m.kind==='scale')return `<div class="mini"><h3>Explore: the long-run cost curve</h3>${sparkLine([68,50,37,31,31,35,44], '#c17a25',75)}<p class="hint">Illustrative long-run average cost: declining, flat, then increasing. The shape is conceptual, not numerical data from the presentation.</p></div>`;
return `<div class="mini"><h3>Explore: the efficiency conditions</h3><div class="twocol"><div class="teachblock"><b>Productive</b><h2>P = minimum ATC</h2><p>Lowest feasible average total cost for the firm's output.</p></div><div class="teachblock"><b>Allocative</b><h2>P = MC</h2><p>Marginal benefit equals marginal cost.</p></div></div></div>`}
function learn(){let l=LESSONS[state.lesson],m=MODULES[state.lesson],stage=state.stage||0;let prompt=state.retry?m.retry:m.prompt;let expected=state.retry?m.retryAnswer:m.answer;let detail=state.retry?m.retryDetail:m.detail;let checked=state.tryChecked;return `<div class="panel"><div class="eyebrow">${esc(l.title)} · Based on Fulk's Unit 3 presentations</div><h1>${esc(m.title)}</h1><div class="steps"><span class="stepchip ${stage===0?'on':''}">1 · Learn</span><span class="stepchip ${stage===1?'on':''}">2 · Explore</span><span class="stepchip ${stage===2?'on':''}">3 · Check understanding</span><span class="stepchip ${stage===3?'on':''}">4 · Independent practice</span></div>${stage===0?`<div class="teachblock"><h3>Understand the idea</h3><p>${esc(m.intro)}</p><h3>What to remember</h3><p>${esc(m.key)}</p></div><div class="mini"><b>Important distinction</b><p>${esc(m.take)}</p></div>${btn('Try the interactive example →',()=>{state.stage=1;save();render()},'primary')}`:stage===1?`${interact(m)}<div class="buttonrow">${btn('← Review explanation',()=>{state.stage=0;save();render()},'ghost')}${btn('Check my understanding →',()=>{state.stage=2;state.tryChecked=false;state.tryAnswer='';save();render()},'primary')}</div>`:stage===2?`<div class="mini"><h3>${state.retry?'Targeted retry — new values':'Now you try'}</h3><p class="question">${esc(prompt)}</p><div class="workrow"><label>Your answer <input type="number" inputmode="decimal" id="tryvalue" value="${esc(state.tryAnswer||'')}" step="any" ${checked?'disabled':''}></label>${!checked?btn('Check answer',()=>{let val=document.querySelector('#tryvalue')?.value;if(val===''||!Number.isFinite(Number(val)))return;state.tryAnswer=val;state.tryChecked=true;state.tryCorrect=Math.abs(Number(val)-expected)<.03;state.events.push({type:'graded',time:new Date().toISOString(),question:prompt,concept:l.questions[0].concept,answer:val,correct:state.tryCorrect,expected,mode:state.retry?'remediation':'guided',lesson:l.title});save();render()},'primary'):''}</div>${checked?`<div class="feedback ${state.tryCorrect?'correct':'wrong'}"><b>${state.tryCorrect?'Correct — well done':'Not quite — here is the worked solution'}</b><p>${esc(detail)}</p></div><div class="buttonrow">${!state.tryCorrect&&!state.retry?btn('Try a related problem',()=>{state.retry=true;state.tryChecked=false;state.tryAnswer='';save();render()},'primary'):btn('Continue to independent practice →',()=>{state.stage=3;save();render()},'primary')}${btn('Explore example again',()=>{state.stage=1;save();render()},'ghost')}</div>`:''}</div>`:`<div class="teachblock"><h3>Independent practice</h3><p>Answer a set of questions without seeing each solution ahead of time. The lesson's answers are checked immediately and recorded by concept. Missed questions will appear in your progress report.</p></div>${btn('Begin practice questions',()=>{state.diagnostic=false;state.mode='exercise';state.index=0;state.submitted=false;state.attempted=[];save();render()},'primary')} ${btn('Review lesson',()=>{state.stage=0;save();render()},'ghost')}`}</div>`}
function practiceHome(){return `<div class="panel"><h1>Learn & practice</h1><p class="muted">Start with instruction. Explore a manipulable example, solve a worked check, then complete independent course-aligned practice. You can study without first taking the diagnostic.</p>${LESSONS.map((l,i)=>`<div class="listrow"><div><b>${esc(l.title)}</b><div class="hint">${esc(l.description)}</div></div>${btn('Start lesson',()=>navigate('learn',i),'primary')}</div>`).join('')}</div>`}
function diagnosticHome(){return `<div class="panel"><h1>Independent diagnostic</h1><p>12 mixed questions from the instructor's Unit 3 material. No explanations until completion. You can repeat the diagnostic to compare attempts.</p><p class="notice">The diagnostic is designed for practice, not as an official AP or teacher assessment. Some content is currently multiple-choice and numeric; graph drawing and FRQ grading are future development stages.</p>${btn('Begin diagnostic',()=>{state.diagnostic=true;navigate('exercise');state.diagnostic=true;save();render()},'primary')}</div>`}
function graphs(){let shift=state.graphShift;let price=25+shift*.45,quantity=55+shift*.55;let p=v=>230-v*2.6,x=v=>50+v*3.4;return `<div class="panel"><h1>Graph lab</h1><p class="muted">Illustrative market-to-firm model. Change demand; watch the competitive market price and the horizontal price line facing one firm.</p><div class="graph"><svg viewBox="0 0 780 290" aria-label="Linked market demand and firm price line"><text x="18" y="20" font-weight="bold">Industry market</text><text x="410" y="20" font-weight="bold">Price-taking firm</text><g stroke="#263448" stroke-width="2"><path d="M50 35 V230 H365" fill="none"/><path d="M440 35 V230 H750" fill="none"/></g><g fill="none" stroke-width="3"><path d="M80 210 L315 57" stroke="#e08742"/><path d="M${x(10)} ${p(60+shift)} L${x(100)} ${p(10+shift)}" stroke="#3d73d6"/><path d="M450 ${p(price)}H735" stroke="#3d73d6"/></g><g stroke="#798ca7" stroke-dasharray="4 5"><line x1="${x(quantity)}" y1="${p(price)}" x2="${x(quantity)}" y2="230"/><line x1="50" y1="${p(price)}" x2="${x(quantity)}" y2="${p(price)}"/></g><circle cx="${x(quantity)}" cy="${p(price)}" r="5" fill="#0d9270"/><g fill="currentColor" font-size="13"><text x="275" y="63">S</text><text x="325" y="${Math.max(45,p(10+shift))}">D</text><text x="685" y="${p(price)-8}">P = MR</text><text x="320" y="253">Quantity</text><text x="700" y="253">Firm output</text><text x="5" y="42">Price</text><text x="395" y="42">Price</text><text x="95" y="274">Illustrative curves — not drawn to a course dataset</text></g></svg></div><div class="graphcontrols"><label>Demand shift <input id="shift" type="range" min="-20" max="20" step="5" value="${shift}"></label><b>${shift>0?'Rightward':shift<0?'Leftward':'No shift'}</b>${btn('Reset',()=>{state.graphShift=0;save();render()})}</div><div class="lesson"><b>What to observe:</b> An increase in market demand (with supply unchanged) raises market price. The individual firm takes the resulting price as given. This diagram illustrates the immediate market-to-firm effect, not the entire long-run entry/exit adjustment.</div><p class="notice">Graph lab v1 demonstrates relationships. Interactive graph construction and line placement are planned, not yet implemented.</p></div>`}
function progress(){let s=conceptStats(),t=totals(),rows=Object.entries(s).sort((a,b)=>a[1].correct/a[1].n-b[1].correct/b[1].n);return `<div class="panel"><h1>Progress report</h1><div class="grid"><div class="metric"><span>Answers</span><b>${t.n}</b></div><div class="metric"><span>Accuracy</span><b>${t.n?Math.round(100*t.correct/t.n)+'%':'—'}</b></div><div class="metric"><span>Concepts practiced</span><b>${t.concepts}</b></div></div><h3>Concept results</h3>${rows.length?rows.map(([k,v])=>`<div class="listrow"><div><b>${esc(k.replaceAll('_',' '))}</b><div class="hint">${v.correct}/${v.n} correct${v.last===0?' · Most recent attempt incorrect':''}</div></div><b>${Math.round(v.correct/v.n*100)}%</b></div>`).join(''):'<p>No graded responses yet. Start the diagnostic or practice.</p>'}<div class="buttonrow">${btn('Export CSV',exportCSV,'primary')}${btn('Export JSON',exportJSON)}${btn('Reset all progress',reset,'ghost')}</div><p class="hint">Results are stored in this browser using localStorage. They are not synced across devices and no parent emails are sent yet. Export data before clearing browser data.</p></div>`}
function download(name,type,body){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function exportCSV(){let fields=['time','mode','lesson','concept','question','answer','expected','correct'];let lines=[fields.join(','),...state.events.filter(e=>e.type==='graded').map(r=>fields.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))];download('cade-unit3-attempts.csv','text/csv',lines.join('\r\n'))}function exportJSON(){download('cade-unit3-progress.json','application/json',JSON.stringify(state,null,2))}function reset(){if(confirm('Erase all practice results on this device?')){state=initial();save();render()}}
function render(){ui={};document.querySelector('#sidebar').innerHTML=nav();let c=document.querySelector('#content');c.innerHTML=state.mode==='home'?home():state.mode==='practice'?practiceHome():state.mode==='learn'?learn():state.mode==='diagnostic'?diagnosticHome():state.mode==='exercise'?exercise():state.mode==='graphs'?graphs():progress();document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>ui[b.dataset.action]());document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));let cq=document.querySelector('#costq');if(cq)cq.onchange=()=>{state.costQ=Number(cq.value);save();render()};let fc=document.querySelector('#fixedc');if(fc)fc.onchange=()=>{state.fc=Number(fc.value);save();render()};let sh=document.querySelector('#shift');if(sh)sh.oninput=()=>{state.graphShift=Number(sh.value);save();render()}}
render();
</script></body></html>
